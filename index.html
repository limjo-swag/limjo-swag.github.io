<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>limjo-swag</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a0b2e 0%, #090514 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, #a855f7, #6366f1);
            filter: blur(120px);
            border-radius: 50%;
            opacity: 0.3;
            animation: floatGlow 8s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes floatGlow {
            0% { transform: translate(-50px, -50px) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            z-index: 1;
            transform: translateY(20px);
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            to { transform: translateY(0); opacity: 1; }
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(168, 85, 247, 0.6);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            margin-bottom: 20px;
            transition: transform 0.5s ease;
        }

        .avatar:hover {
            transform: rotate(360deg) scale(1.05);
        }

        .nickname {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, #a855f7, #6366f1, #fff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGradient 4s linear infinite;
            margin-bottom: 8px;
        }

        @keyframes textGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .status {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #f1f5f9;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .btn-link:hover::before {
            left: 100%;
        }

        .btn-link:hover {
            background: rgba(168, 85, 247, 0.1);
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
            transform: scale(1.02);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="profile-card">
        <img class="avatar" src="https://dicebear.com" alt="Avatar">
        
        <div class="nickname">LIMJO-SWAG</div>
        
        <div class="status">nobody wants to die</div>

        <div class="links-container">
            <a href="https://steamcommunity.com" target="_blank" class="btn-link">Steam Профиль</a>
            <a href="https://t.me" target="_blank" class="btn-link">Telegram</a>
            <a href="https://discord.com" target="_blank" class="btn-link">Discord</a>
        </div>
    </div>

</body>
</html>
