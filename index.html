<style>
  :root{
    --accent:#b66bff;
    --text:#f4eeff;
    --muted:rgba(240,230,255,.62);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#05070a;color:var(--text);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif}
  @media (hover:hover) and (pointer:fine){ *{cursor:none!important} }

  /* ---------- BACKGROUND ---------- */
  #bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;
    filter:brightness(.62) saturate(1.1);transform:scale(1.04)}
  #bg-fallback{position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse at 50% 120%,#0f2a1f 0%,transparent 60%),
      radial-gradient(ellipse at 20% 0%,#10281f 0%,transparent 55%),
      linear-gradient(#070d0b,#0a1512 60%,#040807);}
  #rain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.0;transition:opacity 1s}
  body.no-video #rain{opacity:.9}
  .vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.65) 100%)}

  /* ---------- ENTER SCREEN ---------- */
  #enter{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
    background:rgba(4,6,8,.55);backdrop-filter:blur(22px) brightness(.7);
    -webkit-backdrop-filter:blur(22px) brightness(.7);
    transition:opacity .9s ease, visibility .9s, backdrop-filter .9s;user-select:none}
  #enter.hide{opacity:0;visibility:hidden;backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0)}
  #enter span{font-size:clamp(15px,2vw,19px);letter-spacing:.42em;text-transform:uppercase;
    color:rgba(255,255,255,.8);animation:pulse 2.4s ease-in-out infinite;
    text-shadow:0 0 18px rgba(182,107,255,.6)}
  @keyframes pulse{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

  /* ---------- CARD (LIQUID GLASS) ---------- */
  main{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;overflow-y:auto;scrollbar-width:none;
    perspective:1200px}
  .card{
    --mx:50%;--my:0%;
    position:relative;width:min(440px,100%);padding:34px 26px 28px;border-radius:34px;
    background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
    backdrop-filter:blur(18px) saturate(1.8) brightness(1.05);
    -webkit-backdrop-filter:blur(18px) saturate(1.8) brightness(1.05);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.55),
      inset 0 -1px 1px rgba(255,255,255,.12),
      inset 0 0 40px rgba(255,255,255,.05),
      0 30px 80px rgba(0,0,0,.55),
      0 0 calc(60px + var(--beat,0)*70px) rgba(182,107,255,calc(.12 + var(--beat,0)*.3));
    transform-style:preserve-3d;transition:transform .25s ease-out;
    opacity:0;translate:0 30px;
  }
  body.entered .card{animation:cardIn 1.1s cubic-bezier(.2,.9,.2,1) .25s forwards}
  @keyframes cardIn{to{opacity:1;translate:0 0}}
  /* light that follows the mouse */
  .card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(260px circle at var(--mx) var(--my),rgba(255,255,255,.22),transparent 60%);
    mix-blend-mode:overlay}
  /* glossy top edge */
  .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 22%);
    -webkit-mask:linear-gradient(#000,transparent 40%);mask:linear-gradient(#000,transparent 40%)}

  .avatar{width:96px;height:96px;margin:0 auto 16px;border-radius:50%;position:relative;
    display:grid;place-items:center;font-size:38px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#7b3fe4,#c56bff);
    box-shadow:0 0 0 3px rgba(255,255,255,.18),0 0 calc(34px + var(--beat,0)*40px) rgba(182,107,255,calc(.55 + var(--beat,0)*.4)),inset 0 2px 4px rgba(255,255,255,.4);
    transform:scale(calc(1 + var(--beat,0)*.08));
    overflow:hidden}
  .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

  h1{text-align:center;font-size:32px;font-weight:900;letter-spacing:.06em;
    background:linear-gradient(90deg,#d9b0ff,#a855f7,#d9b0ff);background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 5s linear infinite;filter:drop-shadow(0 0 14px rgba(168,85,247,.45))}
  @keyframes shine{to{background-position:200% center}}
  .sub{text-align:center;margin:8px 0 26px;font-size:15px;color:var(--muted);min-height:1.4em}
  .sub i{display:inline-block;width:1px;height:1em;background:var(--muted);margin-left:2px;
    vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .links{display:grid;gap:12px}
  .link{
    position:relative;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;
    color:var(--text);text-decoration:none;font-weight:600;font-size:16px;overflow:hidden;
    background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.12);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.25);
    transition:transform .3s cubic-bezier(.2,.9,.2,1),background .3s,border-color .3s,box-shadow .3s;
    opacity:0;translate:0 14px}
  body.entered .link{animation:linkIn .7s cubic-bezier(.2,.9,.2,1) forwards}
  body.entered .link:nth-child(1){animation-delay:.7s}
  body.entered .link:nth-child(2){animation-delay:.82s}
  body.entered .link:nth-child(3){animation-delay:.94s}
  @keyframes linkIn{to{opacity:1;translate:0 0}}
  .link::before{content:"";position:absolute;top:0;left:-120%;width:80%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);
    transform:skewX(-20deg);transition:left .7s ease}
  .link:hover::before{left:140%}
  .link:hover{transform:translateY(-3px) scale(1.02);
    background:linear-gradient(135deg,rgba(182,107,255,.28),rgba(255,255,255,.06));
    border-color:rgba(200,150,255,.45);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 12px 30px rgba(120,60,220,.35)}
  .link:active{transform:scale(.98)}
  .link svg{width:24px;height:24px;flex:none;fill:currentColor;opacity:.92}
  .link span{flex:1;text-align:center;margin-right:24px}

  /* ---------- RAIN DROPS ON GLASS ---------- */
  #drops{position:absolute;inset:0;width:100%;height:100%;border-radius:34px;pointer-events:none}

  /* ---------- LIGHTNING ---------- */
  #flash{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .07s linear;
    background:radial-gradient(ellipse at 30% 0%,rgba(215,228,255,.95),rgba(140,170,255,.4) 55%,transparent 85%)}

  /* ---------- MUSIC PLAYER ---------- */
  .player{margin-top:16px;display:flex;flex-direction:column;gap:10px;padding:12px 16px 10px;border-radius:26px;
    background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 1px rgba(255,255,255,.3);
    opacity:0}
  body.entered .player{animation:linkIn .7s cubic-bezier(.2,.9,.2,1) 1.1s forwards}
  #pp{width:34px;height:34px;flex:none;border-radius:50%;border:0;color:#fff;display:grid;place-items:center;
    background:linear-gradient(135deg,#7b3fe4,#c56bff);box-shadow:0 0 16px rgba(182,107,255,.5);transition:transform .2s}
  #pp:hover{transform:scale(1.1)}
  #pp svg{width:16px;height:16px;fill:currentColor}
  .track{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track b{color:var(--text);font-weight:600}
  .prow{display:flex;align-items:center;gap:10px}
  .ctrl{display:flex;align-items:center;gap:4px;flex:none}
  .pbtn{width:30px;height:30px;border:0;background:transparent;color:rgba(255,255,255,.85);border-radius:50%;
    display:grid;place-items:center;transition:transform .2s,color .2s}
  .pbtn:hover{transform:scale(1.15);color:#fff}
  .pbtn svg{width:16px;height:16px;fill:currentColor}
  .prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .prog span{min-width:34px}
  #tLeft{text-align:right}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;outline:none;border:0;
    background:linear-gradient(90deg,var(--accent) var(--p,0%),rgba(255,255,255,.2) var(--p,0%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#fff;border:0;box-shadow:0 0 8px var(--accent)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 8px var(--accent)}
  #vol{width:72px;flex:none}
  #seek{flex:1;min-width:0}
  @media (max-width:420px){#vol{width:48px}}

  /* ---------- DYNAMIC ISLAND ---------- */
  #island{position:fixed;top:14px;left:50%;z-index:100;transform:translateX(-50%);
    width:110px;height:32px;border-radius:20px;background:#000;color:#fff;overflow:hidden;
    display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.08),0 12px 40px rgba(0,0,0,.6);
    transition:width .55s cubic-bezier(.3,1.5,.4,1),height .55s cubic-bezier(.3,1.5,.4,1),
      border-radius .55s cubic-bezier(.3,1.5,.4,1),opacity .25s}
  #island.show{opacity:1;width:var(--w,230px);height:56px;border-radius:32px}
  #island .in{display:flex;align-items:center;gap:12px;white-space:nowrap;opacity:0;transform:scale(.7);
    transition:opacity .2s,transform .3s}
  #island.show .in{opacity:1;transform:scale(1);transition:opacity .3s .2s,transform .45s cubic-bezier(.3,1.5,.4,1) .15s}
  #island .ok{width:30px;height:30px;border-radius:50%;background:#30d158;flex:none;display:grid;
    place-items:center;font-size:15px;line-height:1;color:#fff;font-weight:800}
  #island .txt{display:flex;flex-direction:column;line-height:1.25;text-align:left}
  #island b{font-size:14px;font-weight:700}
  #island small{font-size:12px;color:rgba(255,255,255,.6)}

  /* остров: улучшенная версия */
  #island{top:max(14px,env(safe-area-inset-top))}
  #island.show{box-shadow:0 0 0 1px rgba(255,255,255,.1),0 14px 44px rgba(0,0,0,.65),
    0 0 34px color-mix(in srgb,var(--c,#30d158) 40%,transparent)}
  #island .in{filter:blur(8px);transition:opacity .2s,transform .3s,filter .2s}
  #island.show .in{filter:blur(0);transition:opacity .3s .2s,transform .45s cubic-bezier(.3,1.5,.4,1) .15s,filter .4s .15s}
  #island.show .ok{animation:okpop .5s cubic-bezier(.3,1.8,.5,1) .2s both}
  @keyframes okpop{from{scale:.4}to{scale:1}}
  #island .ok svg{width:18px;height:18px;fill:#fff}
  #island.bump{animation:bump .35s cubic-bezier(.3,1.6,.4,1)}
  @keyframes bump{50%{scale:1.07 .94}}
  #island .tick{display:none;width:22px;height:22px;flex:none;fill:none;stroke:#30d158;stroke-width:3;
    stroke-linecap:round;stroke-linejoin:round}
  #island.ticked .tick{display:block}
  #island .tick path{stroke-dasharray:1;stroke-dashoffset:1}
  #island.show.ticked .tick path{animation:draw .5s ease-out .55s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  #island .bar{position:absolute;left:18px;right:18px;bottom:5px;height:2px;border-radius:2px;
    background:rgba(255,255,255,.28);transform-origin:left;transform:scaleX(0);opacity:0}
  #island.show .bar{opacity:1;animation:bar var(--ms,2.2s) linear forwards}
  @keyframes bar{from{transform:scaleX(1)}to{transform:scaleX(0)}}

  /* эквалайзер и бегущая строка в плеере */
  .eq{display:flex;align-items:flex-end;gap:2px;height:16px;flex:none}
  .eq i{display:block;width:3px;height:100%;border-radius:2px;transform-origin:bottom;transform:scaleY(.12);
    background:linear-gradient(#e2b8ff,#8b5cf6)}
  .track b{display:inline-block}
  .track b.scroll{animation:mq 9s ease-in-out infinite alternate}
  @keyframes mq{0%,12%{translate:0 0}88%,100%{translate:var(--shift) 0}}
  .link:focus-visible,.pbtn:focus-visible,#pp:focus-visible,#snd:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* тексты песен (караоке) */
  .lyrics{display:none;gap:3px;text-align:center;padding:2px 6px 0;min-height:52px;align-content:center}
  .lyrics.on{display:grid}
  .lyrics .cur{font-size:15px;font-weight:700;color:#fff;line-height:1.3;min-height:1.3em;
    text-shadow:0 0 calc(8px + var(--beat,0) * 18px) rgba(182,107,255,.85)}
  .lyrics .next{font-size:12px;color:var(--muted);line-height:1.3;min-height:1.3em;opacity:.7}
  .lyrics .cur.swap{animation:lyin .35s ease-out}
  @keyframes lyin{from{opacity:0;translate:0 6px;filter:blur(3px)}to{opacity:1;translate:0 0;filter:none}}

  /* большой текст на экране (караоке) */
  body.lybig .lyrics{display:none!important}
  #stage{position:fixed;left:0;right:0;bottom:24px;z-index:12;pointer-events:none;text-align:center;
    display:none;padding:0 5vw}
  body.haslyr.lybig #stage{display:block}
  #stage p{margin:0 auto;max-width:min(920px,100%);text-wrap:balance}
  #stage .sp{font-size:clamp(12px,1.3vw,15px);color:rgba(255,255,255,.3);min-height:1.4em;margin-bottom:4px}
  #stage .sn{font-size:clamp(13px,1.5vw,17px);color:rgba(255,255,255,.42);min-height:1.4em;margin-top:6px}
  #stage .sc{font-size:clamp(22px,3.2vw,40px);font-weight:800;line-height:1.2;min-height:1.2em;
    filter:drop-shadow(0 0 calc(10px + var(--beat,0) * 22px) rgba(182,107,255,.75));
    scale:calc(1 + var(--beat,0) * .025)}
  #stage .sc span{display:inline-block;color:transparent;
    background:linear-gradient(90deg,#fff var(--prog,0%),rgba(255,255,255,.38) var(--prog,0%));
    -webkit-background-clip:text;background-clip:text}
  #stage .sc span.swap{animation:sIn .5s cubic-bezier(.2,.9,.2,1)}
  @keyframes sIn{from{opacity:0;translate:0 16px;filter:blur(6px);letter-spacing:.06em}
    to{opacity:1;translate:0 0;filter:blur(0);letter-spacing:0}}

  /* ---------- SOUND BUTTON ---------- */
  #snd{position:fixed;right:20px;bottom:20px;z-index:20;width:46px;height:46px;border-radius:50%;
    display:grid;place-items:center;border:1px solid rgba(255,255,255,.18);color:#fff;
    background:rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.4);opacity:0;transition:opacity .6s 1.2s,transform .2s}
  body.entered #snd{opacity:1}
  #snd:hover{transform:scale(1.1)}
  #snd svg{width:20px;height:20px;fill:currentColor}

  /* ---------- GLITCH ---------- */
  h1{position:relative}
  h1::before,h1::after{content:attr(data-text);position:absolute;inset:0;text-align:center;
    pointer-events:none;opacity:0;mix-blend-mode:screen}
  h1::before{color:#00f0ff}
  h1::after{color:#ff2bd6}
  h1.glitch,h1.hov{animation:shine 5s linear infinite,jit .3s steps(2,end) infinite}
  h1.glitch::before,h1.hov::before{opacity:.9;animation:gl1 .4s steps(1,end) infinite}
  h1.glitch::after,h1.hov::after{opacity:.9;animation:gl2 .4s steps(1,end) infinite}
  @keyframes jit{0%{translate:0 0}50%{translate:2px -1px}100%{translate:-2px 1px}}
  @keyframes gl1{
    0%{clip-path:inset(0 0 70% 0);translate:-4px 0}
    20%{clip-path:inset(35% 0 40% 0);translate:3px 1px}
    40%{clip-path:inset(70% 0 5% 0);translate:-3px -1px}
    60%{clip-path:inset(10% 0 60% 0);translate:5px 0}
    80%{clip-path:inset(50% 0 20% 0);translate:-2px 1px}
    100%{clip-path:inset(0 0 70% 0);translate:4px 0}}
  @keyframes gl2{
    0%{clip-path:inset(60% 0 10% 0);translate:4px 0}
    25%{clip-path:inset(5% 0 75% 0);translate:-5px 1px}
    50%{clip-path:inset(40% 0 35% 0);translate:3px -1px}
    75%{clip-path:inset(80% 0 0 0);translate:-4px 0}
    100%{clip-path:inset(60% 0 10% 0);translate:2px 1px}}
  #fx{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
  .avatar{cursor:pointer}
  .avatar.spin{animation:aspin .8s cubic-bezier(.3,1.4,.4,1)}
  @keyframes aspin{to{rotate:360deg}}
  .avatar.glitch{animation:avj .3s steps(2,end) infinite}
  @keyframes avj{
    0%{translate:-2px 1px;filter:hue-rotate(0deg)}
    50%{translate:3px -1px;filter:hue-rotate(120deg) saturate(2)}
    100%{translate:-1px 0;filter:none}}
  body.storm main{animation:shake .14s linear infinite}
  @keyframes shake{0%,100%{translate:0 0}25%{translate:1.5px -1px}75%{translate:-1.5px 1px}}
  #trail{position:fixed;inset:0;width:100%;height:100%;z-index:998;pointer-events:none}
  @keyframes rs{to{rotate:360deg}}

  /* ---------- CUSTOM CURSOR ---------- */
  .cur-dot,.cur-ring{position:fixed;left:0;top:0;z-index:999;pointer-events:none;border-radius:50%;
    transform:translate(-50%,-50%);will-change:transform;display:none}
  @media (hover:hover) and (pointer:fine){.cur-dot,.cur-ring{display:block}}
  .cur-dot{width:7px;height:7px;background:#fff;box-shadow:0 0 12px 2px var(--accent)}
  .cur-ring{width:38px;height:38px;border:1.5px dashed rgba(255,255,255,.6);animation:rs 7s linear infinite;
    transition:width .25s,height .25s,background .25s,border-color .25s;
    backdrop-filter:blur(2px)}
  .cur-ring.hover{width:62px;height:62px;background:rgba(182,107,255,.18);border-color:var(--accent)}
  .cur-ring.down{width:26px;height:26px}
</style>
</head>
<body>

<!-- Положи видео рядом с index.html и назови rain.mp4 -->

<video id="bg-video" src="rain.mp4" loop muted playsinline preload="auto"></video>
<canvas id="rain"></canvas>
<audio id="music" preload="auto"></audio>
<div class="vignette"></div>
<div id="flash"></div>

<div id="enter"><span>press to continue</span></div>

<script>
(() => {
  const $ = s => document.querySelector(s);

  const dot = $('#dot'), ring = $('#ring');
  let storm = false, hotReady = false;
  const eqBars = Array.from(document.querySelectorAll('#eq i')), EQ_BINS = [2, 5, 12, 30, 70];
  const eqLevel = [.12, .12, .12, .12, .12];
  const lyBox = $('#lyrics'), lyCur = $('#lCur'), lyNext = $('#lNext');
  const stage = $('#stage'), sPrev = $('#sPrev'), sCur = $('#sCur'), sNext = $('#sNext');
  let lyr = [], lyrIdx = -1, lyrShown = -2;

  const TRACKS = [
    { src: 'track.mp3',  name: 'gothviolence - cut my face',       lrc: 'track.lrc'  },
    { src: 'track2.mp3', name: 'вышелпокурить - нам не повезло',   lrc: 'track2.lrc' },

  video.addEventListener('loadeddata', () => $('#bg-fallback').style.opacity = 0);

  /* ---------- Press to continue ---------- */
  let entered = false;
  function go() {
    if (entered) return; entered = true;
    document.body.classList.add('entered');
    enter.classList.add('hide');
    video.muted = false; video.volume = .3;      // дождь тише, чтобы музыка была главной
    music.volume = $('#vol').value / 100;

    setTimeout(lightning, 5000); setTimeout(() => glitch(500), 1600); setTimeout(() => hotReady = true, 600);                 // первая молния через 5 сек
    music.play().then(updatePP).catch(updatePP);

    syncIcon();

  }

  }

  /* ---------- Музыка ---------- */
  const seek = $('#seek'), vol = $('#vol');
  const failed = new Set();                       // треки, файлов которых нет

  function pick(from, dir){
    const n = TRACKS.length;
    for (let k = 1; k <= n; k++){
      const i = (((from + dir * k) % n) + n) % n;
      if (!failed.has(i)) return i;

  function pop(title, sub, icon = '✓', color = '#30d158', ms = 2200, opts = {}){

    try { await navigator.clipboard.writeText(text); }
    catch {
      const t = document.createElement('textarea'); t.value = text;
      t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); } catch {}

  function initAudio(){
    // работает на сайте (http/https); при открытии файла двойным кликом браузер глушит анализ
    if (analyser || !/^https?:/.test(location.protocol)) return;

      target = Math.pow(Math.max(0, lvl / Math.max(peak, .15)), 3);   // реагирует на сильные удары

    }
    card.style.setProperty('--beat', env.toFixed(3));
    stage.style.setProperty('--beat', env.toFixed(3));

      x: Math.random() * dw, y: Math.random() * dh * .9,

      age: 0, ttl: 400 + Math.random() * 600,

      if (!d.slide && d.r > 2.4 && env > .6 && Math.random() < .03){ d.slide = true; d.wait = 0; }
      if (d.slide && d.age > d.wait){
        if (Math.random() < .04) d.vy = .4 + Math.random() * 1.6;   // капля то стоит, то дёргается вниз
        d.vy *= .985;

      }

  function lightning(){
    if (calm) return;

  }

  /* ---------- Курсор ---------- */
  let mx = innerWidth/2, my = innerHeight/2, rx = mx, ry = my;

  addEventListener('mousemove', e => {

    card.style.setProperty('--my', (e.clientY - r.top) + 'px');

  /* ---------- Глитч ---------- */
  const nick = $('#nick'), fx = $('#fx'), avatar = $('.avatar');
  function screenGlitch(){                                  // цветные полосы на весь экран
    for (let i = 0; i < 7; i++){
      const s = document.createElement('div');
      const cyan = Math.random() < .5;
      s.style.cssText = `position:absolute;left:0;right:0;top:${Math.random() * 100}%;height:${2 + Math.random() * 8}%;` +
        `background:${cyan ? 'rgba(0,240,255,.16)' : 'rgba(255,43,214,.16)'};` +
        `transform:translateX(${(Math.random() - .5) * 60}px);mix-blend-mode:screen`;

      setTimeout(() => s.remove(), 110 + Math.random() * 120);
    }
  }
  function glitch(ms = 450, screen = true){
    nick.classList.add('glitch'); avatar.classList.add('glitch');
    if (screen && !calm) screenGlitch();
    setTimeout(() => { nick.classList.remove('glitch'); avatar.classList.remove('glitch'); }, ms);
  }
  nick.addEventListener('mouseenter', () => nick.classList.add('hov'));
  nick.addEventListener('mouseleave', () => nick.classList.remove('hov'));
  nick.addEventListener('click', () => glitch(600));
  (function autoGlitch(){                                   // случайный глитч раз в 6–15 сек
    setTimeout(() => { if (entered) glitch(320, Math.random() < .5); autoGlitch(); }, 6000 + Math.random() * 9000);
  })();

  /* ---------- Тексты песен (.lrc с таймкодами) ---------- */
  function parseLRC(txt){
    const out = []; let offset = 0;
    for (const raw of txt.split(/\r?\n/)){
      const o = raw.match(/^\[offset:\s*([+-]?\d+)\]/i);
      if (o){ offset = +o[1] / 1000; continue; }
      const tags = [...raw.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];
      if (!tags.length) continue;                              // служебные теги [ar:...] и пустые строки
      const s = raw.replace(/\[[^\]]*\]/g, '').trim();
      for (const m of tags) out.push({ t: +m[1] * 60 + parseFloat(m[2].replace(':', '.')) - offset, s });
    }
    return out.sort((a, b) => a.t - b.t);
  }
  function renderLyr(){
    const c = lyrIdx >= 0 ? lyr[lyrIdx].s : '';
    const n = lyr[lyrIdx + 1] ? lyr[lyrIdx + 1].s : '';
    const p = lyrIdx >= 1 ? lyr[lyrIdx - 1].s : '';
    // маленький блок в плеере (запасной вариант для низких экранов)
    lyCur.textContent = lyrIdx >= 0 ? (c || '♪') : '';
    lyNext.textContent = n;
    lyCur.classList.remove('swap'); void lyCur.offsetWidth; lyCur.classList.add('swap');
    // большой текст на экране
    sPrev.textContent = p; sNext.textContent = n;
    sCur.textContent = lyrIdx >= 0 ? (c || '♪ ♪ ♪') : '';
    stage.style.setProperty('--prog', '0%');
    sCur.classList.remove('swap'); void sCur.offsetWidth; sCur.classList.add('swap');
  }
  function loadLyrics(i){
    lyr = []; lyrIdx = -1; lyrShown = -2;
    lyBox.classList.remove('on'); lyCur.textContent = ''; lyNext.textContent = '';
    document.body.classList.remove('haslyr');
    sPrev.textContent = ''; sCur.textContent = ''; sNext.textContent = '';
    // если lrc не указан, ищем файл с тем же именем, что и у трека: track2.mp3 → track2.lrc
    const f = TRACKS[i].lrc || TRACKS[i].src.replace(/\.[^./]+$/, '.lrc');
    fetch(f).then(r => r.ok ? r.text() : Promise.reject())
      .then(t => {
        if (cur !== i) return;                                 // успели переключить трек — не показываем
        const parsed = parseLRC(t);
        if (parsed.length){ lyr = parsed; lyBox.classList.add('on'); document.body.classList.add('haslyr'); }
      })
      .catch(() => {});                                        // файла нет — блока с текстом тоже нет
  }

  /* ---------- Где показывать текст: большой под карточкой или маленький в плеере ---------- */
  function placeLyrics(){
    const extra = document.body.classList.contains('lybig') ? 0 : (lyBox.offsetHeight ? lyBox.offsetHeight + 10 : 0);
    const space = (innerHeight - (card.offsetHeight - extra)) / 2;     // свободное место под карточкой
    document.body.classList.toggle('lybig', space >= 120 && innerWidth >= 520);
    stage.style.bottom = Math.max(12, (space - 108) / 2) + 'px';
  }
  addEventListener('resize', placeLyrics);
  if (window.ResizeObserver) new ResizeObserver(placeLyrics).observe(card);
  placeLyrics();

  /* ---------- Бегущая строка, если название не влезает ---------- */
  function fitTrack(){
    const b = $('#trackName'), box = b.parentElement;
    b.classList.remove('scroll'); b.style.removeProperty('--shift');
    const over = b.offsetWidth - box.clientWidth;
    if (over > 2){
      b.style.setProperty('--shift', -(over + 6) + 'px');
      b.style.animationDuration = Math.max(5, over / 14 + 4) + 's';
      b.classList.add('scroll');
    }
  }
  addEventListener('resize', fitTrack);

  /* ---------- Пасхалки ---------- */
  let stormT;
  function startStorm(){
    if (storm) return; storm = true;
    document.body.classList.add('storm');
    pop('Шторм', 'держись крепче', '⛈', '#6366f1', 2600);
    glitch(700);
    (function hits(){ if (!storm) return; strike(); setTimeout(hits, 1800 + Math.random() * 3200); })();
    stormT = setTimeout(endStorm, 22000);
  }
  function endStorm(){
    storm = false; document.body.classList.remove('storm');
    pop('Стихло', 'дождь остался 🌧', '🌧', '#38bdf8', 2000);
  }

  // 1) клик по аватарке: крутится, а на 5-й раз начинается шторм
  const OUCH = ['ай!', 'не трогай 🌧', 'щекотно', 'хватит', 'я не кнопка'];
  let aClicks = 0, aT;
  avatar.addEventListener('click', () => {
    avatar.classList.remove('spin'); void avatar.offsetWidth; avatar.classList.add('spin');
    glitch(350);
    aClicks++; clearTimeout(aT); aT = setTimeout(() => aClicks = 0, 1500);
    if (aClicks >= 5){ aClicks = 0; startStorm(); }
    else pop(OUCH[Math.floor(Math.random() * OUCH.length)], aClicks >= 3 ? 'ещё чуть-чуть…' : '', '👆', '#8b5cf6', 1400);
  });

  // 2) клик по 🌧🌧🌧 — молния
  $('.sub').addEventListener('click', () => { strike(); pop('Гроза', '', '⚡', '#eab308', 1200); });

  // 3) konami code, слова «storm»/«шторм»/«glitch»/«глитч», пробел = пауза
  const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  const RU = { b: 'и', a: 'ф' };
  let kpos = 0, typed = '';
  addEventListener('keydown', e => {
    if (!hotReady) return;
    const k = e.key, kl = k.toLowerCase(), want = KONAMI[kpos];
    if (k === want || kl === want || kl === RU[want]){
      if (++kpos === KONAMI.length){
        kpos = 0;
        pop('KONAMI', '+30 жизней', '🎮', '#f59e0b', 2600); glitch(1800); startStorm();
      }
    } else kpos = (k === KONAMI[0]) ? 1 : 0;

    if (k.length === 1){
      typed = (typed + kl).slice(-8);
      if (/storm$|шторм$/.test(typed)) startStorm();
      if (/glitch$|глитч$/.test(typed)){ glitch(1400); pop('Глитч', 'что-то сломалось?', '👾', '#ec4899', 1800); }
    }
    const t = e.target && e.target.closest ? e.target : document.body;
    if (k === ' ' && !t.closest('button,a,input')){ e.preventDefault(); $('#pp').click(); }
  });

  // 4) вкладка зовёт назад
  const TITLE0 = document.title;
  document.addEventListener('visibilitychange', () => { document.title = document.hidden ? '🌧 вернись...' : TITLE0; });

  // 5) если долго ничего не трогать
  let idleT;
  function resetIdle(){
    clearTimeout(idleT);
    idleT = setTimeout(() => { if (entered) pop('ты тут?', 'дождь всё ещё идёт', '💤', '#64748b', 2600); }, 30000);
  }
  addEventListener('mousemove', resetIdle); addEventListener('keydown', resetIdle); resetIdle();

  // 6) для тех, кто открыл консоль
  console.log('%c@половинкаменя %c🌧  попробуй: 5 кликов по аватарке, слово storm, konami code',
    'color:#b66bff;font-weight:900;font-size:16px', 'color:#999');

  /* ---------- Курсор: хвост и брызги по клику ---------- */
  const tc = $('#trail'), tctx = tc.getContext('2d');
  const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
  let tw = 0, th = 0; const pts = [], ripples = [], sparks = [];
  function sizeTrail(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    tw = innerWidth; th = innerHeight; tc.width = tw * dpr; tc.height = th * dpr;
    tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  sizeTrail(); addEventListener('resize', sizeTrail);
  if (fine){
    addEventListener('mousemove', e => {
      pts.push({ x: e.clientX, y: e.clientY, t: performance.now() });
      if (pts.length > 60) pts.shift();
    });
    addEventListener('mousedown', e => {
      const now = performance.now();
      ripples.push({ x: e.clientX, y: e.clientY, t: now });
      for (let i = 0; i < 9; i++){
        const a = Math.random() * 6.2832, v = 1.5 + Math.random() * 3.5;
        sparks.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, t: now });
      }
    });
  }
  (function trailLoop(){
    tctx.clearRect(0, 0, tw, th);
    if (fine){
      const now = performance.now(), LIFE = 480;
      while (pts.length && now - pts[0].t > LIFE) pts.shift();
      tctx.lineCap = 'round'; tctx.lineJoin = 'round';
      for (let i = 1; i < pts.length; i++){                     // хвост: фиолетовый → голубой
        const a = 1 - (now - pts[i].t) / LIFE;
        tctx.strokeStyle = `rgba(${Math.round(182 - 120 * (1 - a))},${Math.round(107 + 120 * (1 - a))},255,${(a * .75).toFixed(3)})`;
        tctx.lineWidth = 1 + a * 5;
        tctx.beginPath(); tctx.moveTo(pts[i - 1].x, pts[i - 1].y); tctx.lineTo(pts[i].x, pts[i].y); tctx.stroke();
      }
      for (let i = ripples.length - 1; i >= 0; i--){            // круги по воде от клика
        const r = ripples[i], p = (now - r.t) / 700;
        if (p >= 1){ ripples.splice(i, 1); continue; }
        tctx.strokeStyle = `rgba(200,150,255,${((1 - p) * .7).toFixed(3)})`; tctx.lineWidth = 2 * (1 - p) + .5;
        tctx.beginPath(); tctx.arc(r.x, r.y, 8 + p * 55, 0, 6.2832); tctx.stroke();
        tctx.beginPath(); tctx.arc(r.x, r.y, 4 + p * 28, 0, 6.2832); tctx.stroke();
      }
      for (let i = sparks.length - 1; i >= 0; i--){             // брызги
        const s = sparks[i], p = (now - s.t) / 600;
        if (p >= 1){ sparks.splice(i, 1); continue; }
        s.x += s.vx; s.y += s.vy; s.vy += .18; s.vx *= .98;
        tctx.fillStyle = `rgba(190,215,255,${(1 - p).toFixed(3)})`;
        tctx.beginPath(); tctx.arc(s.x, s.y, 2 * (1 - p) + .5, 0, 6.2832); tctx.fill();
      }
    }
    requestAnimationFrame(trailLoop);
  })();

  /* ---------- Запасной canvas-дождь (если нет rain.mp4) ---------- */
  const cv = $('#rain'), ctx = cv.getContext('2d');
  let W, H, rainDrops = [];
  function resize(){
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    rainDrops = Array.from({length: Math.floor(W/6)}, () => mk(true));
  }
  function mk(rand){
    return { x: Math.random()*W, y: rand ? Math.random()*H : -20,
             l: 12 + Math.random()*22, v: 14 + Math.random()*16, a: .15 + Math.random()*.35 };
  }
  addEventListener('resize', resize); resize();
  (function draw(){
    ctx.clearRect(0,0,W,H);
    if (document.body.classList.contains('no-video')){
      ctx.lineWidth = 1;
      for (const d of rainDrops){
        ctx.strokeStyle = `rgba(190,215,235,${d.a})`;
        ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l*.18, d.y + d.l); ctx.stroke();
        d.y += d.v; d.x -= d.v*.18;
        if (d.y > H) Object.assign(d, mk(false));
      }
    }
    requestAnimationFrame(draw);
  })();
})();
</script>
</body>
